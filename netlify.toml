[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Content-Security-Policy volutamente permissiva sugli script esterni,
    # perché il sito carica script di terze parti necessari al checkout
    # (Stripe, PayPal, Google Pay). Se in futuro rimuovi uno di questi
    # provider, puoi stringere la policy di conseguenza.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.paypal.com https://www.paypalobjects.com https://pay.google.com; frame-src https://js.stripe.com https://www.paypal.com; connect-src 'self' https://api.stripe.com https://www.paypal.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'"
