[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/chi-siamo"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cart"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ordine-confermato"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/cart"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/account"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/search"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/ordine-confermato"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Header di sicurezza: difesa in profondità a costo zero.
# - nosniff: il browser non "indovina" i tipi di file
# - X-Frame-Options DENY: il sito non può essere incorniciato da siti terzi
#   (anti-clickjacking); il pagamento avviene su Stripe/PayPal, nessuna nostra
#   pagina deve stare in un iframe
# - Referrer-Policy: limita i dati di provenienza inviati a siti terzi
# - HSTS: i browser usano sempre HTTPS
# CSP volutamente NON impostata: con gli script di Stripe/PayPal/Google una CSP
# sbagliata bloccherebbe i pagamenti. Valutabile solo in report-only.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
